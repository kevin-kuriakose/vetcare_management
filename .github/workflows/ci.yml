name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 vetcare_management --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check formatting
        run: |
          pip install black
          black --check vetcare_management
